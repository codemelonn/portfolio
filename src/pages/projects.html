<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Projects</title>
        <link rel="stylesheet" href="/src/css/styles.css" />
        <link rel="stylesheet" href="/src/css/projects.css" />
    </head>
    <body class="h-screen">
        <!-- EXPLORER SHELL -->
        <div class="">
            <div class="flex flex-col rounded-[10px] bg-vanillaCream border-[2px] border-milkTeaBrown [border-style:inset]">
                <!-- TOP TOOLBAR -->
                <div
                    class="border flex rounded-sm items-center gap-2 px-3 py-2 bg-vanilla border-b-[2px] border-milkTeaBrown [border-bottom-style:inset]"
                >
                    <!-- VIEW BUTTONS (NON-FUNCTIONAL FOR NOW)-->
                    <div class="border flex rounded-sm p-1 border-blushPink items-center gap-2">
                        <div class="flex flex-row gap-1  border-milkTeaBrown font-blockBlueprint text-lg text-cocoaText">
                            <button class="px-2 bg-whisperPink grid place-items-center">☰</button>
                            <button class="px-3 bg-whisperPink grid place-items-center">◫</button>
                            <button class="px-2 bg-whisperPink grid place-items-center">▣</button>
                        </div>
                    </div>

                    <!-- FOLDER PATHS -->
                    <div class="flex-1 flex items-center gap-2 px-3 py-1 bg-vanillaCream border-[2px] border-milkTeaBrown">
                        <span class="px-3 py-[2px] border-[2px] border-bone bg-vanilla font-blockBlueprint text-sm text-cocoaText">Desktop</span>
                        <span class="px-3 py-[2px] border-[2px] border-bone bg-sweetPink font-blockBlueprint text-sm text-cocoaText">Projects</span>
                    </div>

                    <!-- SEARCH BUTTON (NON-FUNCTIONAL FOR NOW) -->
                    <div class="flex items-center gap-2">
                        <button class="grid place-items-center px-3 bg-vanillaCream border-milkTeaBrown font-blockBlueprint text-lg text-cocoaText">
                            ⌕
                        </button>
                    </div>
                </div>

                <!-- FOLDER SECTION -->
                <div class="flex-1 p-4 bg-vanillaCream">
                    <div class="w-full"></div>
                </div>

                <!-- FINDER FOOTER -->
                <div
                    class="flex justify-between px-3 py-2 bg-vanilla border-t-[2px] border-milkTeaBrown [border-top-style:inset] font-blockBlueprint text-xs text-cocoaText"
                >
                    <span>__ folders</span>
                    <span>Ready</span>
                </div>
            </div>
        </div>

        <script src="/src/js/projects.js"></script>
    </body>
</html>
