<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- tailwind compiled css -->
        <link rel="stylesheet" href="../dist/output.css" />
        <link rel="stylesheet" href="/src/css/window.css" />
        <!-- JS files-->
        <title>Amara's Portfolio</title>
    </head>

    <body class="font-blockBlueprint bg-softPink h-[900px]">
        <!-- begin screen  -->
        <!-- main-frame -->
        <div
            class="main-frame bg-cherryBlossomPink fixed rounded-lg top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[1024px] h-[768px] z-0">
            <!-- main-frame-wrapper -->
            <div class="main-frame-wrapper flex flex-col">
                <!-- begin top-bar-container -->
                <!-- emulates the top part of a desktop -->
                <div
                    class="top-bar-container fixed bg-[#e7e7e7] drop-shadow-lg z-1 w-[1024px] h-9 rounded-t-lg">
                    <!-- top bar elements here  -->
                    <div class="top-bar h-9 flex flex-row text-xl">
                        <!-- left-side-top-bar -->
                        <div
                            class="left-side-top-bar w-[86%] flex space-x-14 items-center">
                            <p class="pl-3">AMARA OS</p>
                            <p>ABOUT</p>
                            <p>LINKS</p>
                        </div>

                        <!-- right-side-top-bar -->
                        <div
                            class="right-side-top-bar w-[14%] flex justify-center items-center">
                            <p id="current-time" class=""></p>
                        </div>
                    </div>
                </div>

                <!-- begin desktop-container -->
                <!-- environment to emulate the desktop screen -->
                <div
                    class="desktop-container flex flex-row mt-9 h-[calc(768px-36px)] bg-iceBlueDark">
                    <!-- left-pane -->
                    <div
                        class="left-pane w-[86%] flex flex-row justify-center text-center pt-[250px]">
                        <!-- Pane filler -->
                        <div
                            class="pane-filler bg-iceBlue absolute bottom-0 left-0 w-[865px] h-[690px] rounded-tl-[15px] rounded-tr-[15px] rounded-br-[15px] z-0"></div>
                        <div class="window z-10 w-[500px] h-[200px]">
                            <div class="title-bar">
                                <div class="title-bar-text pl-3">
                                    WELCOME TO MY PORTFOLIO
                                </div>
                                <div class="title-bar-controls">
                                    <button aria-label="Minimize">_</button>
                                    <button aria-label="Maximize">□</button>
                                    <button aria-label="Close">✕</button>
                                </div>
                            </div>
                            <div class="window-body">
                                <p>Hello there! My name is Amara and</p>
                            </div>
                        </div>
                    </div>

                    <!-- right-pane -->
                    <div
                        class="right-pane w-[14%] flex flex-col justify-start text-center items-center pt-10">
                        <!-- begin icon tabs -->
                        <!-- clickable folders that open windows -->

                        <div class="icon_group">
                            <img
                                src="/assets/icons/flop_drive.png"
                                alt="flop_drive"
                                class="w-[60px] peer cursor-pointer" />
                            <p
                                class="mb-[50px] mt-[3px] text-[14px] peer-hover:text-[#5f6368] peer-hover:underline peer-hover:drop-shadow-md">
                                DESKTOP
                            </p>
                        </div>

                        <div class="icon_group">
                            <img
                                src="/assets/icons/about_me_2.png"
                                alt="about_me"
                                class="w-[60px] peer cursor-pointer" />
                            <p
                                class="mb-[50px] mt-[3px] text-[14px] peer-hover:text-[#5f6368] peer-hover:underline peer-hover:drop-shadow-md">
                                ABOUT ME
                            </p>
                        </div>
                        <div class="icon_group">
                            <img
                                src="/assets/icons/projects.png"
                                alt="project"
                                class="w-[60px] peer cursor-pointer" />
                            <p
                                class="mb-[50px] mt-[3px] text-[14px] peer-hover:text-[#5f6368] peer-hover:underline peer-hover:drop-shadow-md">
                                PROJECTS
                            </p>
                        </div>

                        <div class="icon_group">
                            <img
                                src="/assets/icons/contact_me3.png"
                                alt="contact_me"
                                class="w-[60px] peer cursor-pointer" />
                            <p
                                class="mb-[50px] mt-[3px] text-[14px] peer-hover:text-[#5f6368] peer-hover:underline peer-hover:drop-shadow-md">
                                CONTACT ME
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="/src/js/desktop_ui.js"></script>
        <script src="/src/js/window_func.js"></script>
    </body>
</html>
