<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Projects</title>
        <link rel="stylesheet" href="/src/css/styles.css" />
        <link rel="stylesheet" href="/src/css/projects.css" />
    </head>
    <body class="h-full overflow-hidden">
        <!-- EXPLORER SHELL -->
        <div class="h-full flex flex-col">
            <div class="flex flex-col mx-2 h-full rounded-[5px] bg-vanillaCream border-[2px] border-roseBlush [border-style:inset]">
                <!-- TOP TOOLBAR -->
                <div
                    class="border flex rounded-sm items-center gap-2 px-2 py-2 bg-vanilla border-b-[2px] border-milkTeaBrown [border-bottom-style:inset]"
                >
                    <!-- VIEW BUTTONS (NON-FUNCTIONAL FOR NOW)-->
                    <div class="flex rounded-sm p-1 items-center gap-2">
                        <div class="flex flex-row gap-1 font-blockBlueprint text-lg text-cocoaText">
                            <button class="px-2 bg-whisperPink grid place-items-center">☰</button>
                            <button class="px-3 bg-whisperPink grid place-items-center">◫</button>
                            <button class="px-2 bg-whisperPink grid place-items-center">▣</button>
                        </div>
                    </div>

                    <!-- FOLDER PATHS -->
                    <div class="flex-1 flex items-center gap-2 px-3 py-1 bg-vanillaCream border-[1px] border-sweetPink">
                        <span class="px-3 py-[2px] font-blockBlueprint text-sm text-cocoaText">Desktop</span>
                        <span class="text-cocoaText text-lg">></span>
                        <span class="px-3 py-[2px] bg-vanilla font-blockBlueprint text-sm text-cocoaText rounded-full">Projects</span>
                    </div>

                    <!-- SEARCH BUTTON (NON-FUNCTIONAL FOR NOW) -->
                    <div class="flex items-center gap-2">
                        <button
                            class="grid place-items-center px-[10px] bg-whisperPink border-milkTeaBrown font-blockBlueprint text-lg text-cocoaText"
                        >
                            ⌕
                        </button>
                    </div>
                </div>

                <!-- FOLDER CONTENT -->
                <div class="flex-1 min-h-0 bg-vanillaCream p-4 overflow-hidden">
                    <!-- FOLDER CONTAINER -->
                    <div class="h-full overflow-y-auto">
                        <div class="h-full grid grid-cols-4 gap-y-8 justify-items-center py-2">
                            <!-- WEB DEVELOPMENT ICON -->
                            <div
                                class="flex flex-col items-center rounded-md px-3 py-2 border-2 border-dashed border-transparent hover:border-milkTeaBrown hover:bg-vanilla cursor-pointer"
                            >
                                <img src="/assets/icons/folder.png" alt="custom folder" class="w-[80px] icon-image" />
                                <p class="mt-1 text-center text-[14px] leading-tight w-[110px]">Web Development</p>
                            </div>

                            <!-- DATABASE ICON -->
                            <div
                                class="flex flex-col items-center rounded-md px-3 py-2 border-2 border-dashed border-transparent hover:border-milkTeaBrown hover:bg-vanilla cursor-pointer"
                            >
                                <img src="/assets/icons/folder.png" class="w-[80px] icon-image" />
                                <p class="mt-1 text-center text-[14px] leading-tight w-[110px]">Database</p>
                            </div>

                            <!-- CYBERSECURITY ICON -->
                            <div
                                class="flex flex-col items-center rounded-md px-3 py-2 border-2 border-dashed border-transparent hover:border-milkTeaBrown hover:bg-vanilla cursor-pointer"
                            >
                                <img src="/assets/icons/folder.png" class="w-[80px] icon-image" />
                                <p class="mt-1 text-center text-[14px] leading-tight w-[110px]">Cybersecurity</p>
                            </div>

                            <!-- DIGITAL FORENSICS ICON -->
                            <div
                                class="flex flex-col items-center rounded-md px-3 py-2 border-2 border-dashed border-transparent hover:border-milkTeaBrown hover:bg-vanilla cursor-pointer"
                            >
                                <img src="/assets/icons/folder.png" class="w-[80px] icon-image" />
                                <p class="mt-1 text-center text-[14px] leading-tight w-[110px]">Digital Forensics</p>
                            </div>

                            <!-- SOFTWARE DEVELOPMENT ICON -->
                            <div
                                class="flex flex-col items-center rounded-md px-3 py-2 border-2 border-dashed border-transparent hover:border-milkTeaBrown hover:bg-vanilla cursor-pointer"
                            >
                                <img src="/assets/icons/folder.png" class="w-[80px] icon-image" />
                                <p class="mt-1 text-center text-[14px] leading-tight w-[110px]">Software Development</p>
                            </div>

                            <!-- GAMES ICON -->
                            <div
                                class="flex flex-col items-center rounded-md px-3 py-2 border-2 border-dashed border-transparent hover:border-milkTeaBrown hover:bg-vanilla cursor-pointer"
                            >
                                <img src="/assets/icons/folder.png" class="w-[80px] icon-image" />
                                <p class="mt-1 text-center text-[14px] leading-tight w-[110px]">Games</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- FINDER FOOTER -->
                <div
                    class="flex justify-between px-3 py-2 bg-vanilla border-t-[2px] border-milkTeaBrown [border-top-style:inset] font-blockBlueprint text-xs text-cocoaText"
                >
                    <span>__ folders</span>
                    <span>Ready</span>
                </div>
            </div>
        </div>

        <script src="/src/js/projects.js"></script>
    </body>
</html>
