<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- tailwind compiled css -->
        <link rel="stylesheet" href="../dist/output.css" />
        <link rel="stylesheet" href="/src/css/window.css" />

        <!-- Font Awesome 6 Free -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />

        <title>Amara's Portfolio</title>
    </head>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadhtml("");
        });
    </script>

    <body class="font-MicrosoftOG text-cocoaText min-w-full min-h-screen">
        <!-- begin screen  -->
        <!-- main-frame -->
        <div class="main-frame fixed rounded-lg z-0 w-screen h-screen">
            <!-- main-frame-wrapper -->
            <div class="main-frame-wrapper flex flex-col h-full">
                <!-- begin top-bar-container -->

                <!-- emulates the top part of a desktop -->
                <div
                    class="top-bar-container text-nowrap fixed bg-vanillaCream z-10 w-full h-9 rounded-t-md"
                >
                    <!-- top bar elements here  -->
                    <div class="top-bar h-10 flex flex-row text-xl shadow-inner">
                        <!-- left-side-top-bar -->
                        <div
                            class="left-side-top-bar w-[86%] flex items-center text-[12px] tracking-[.23em] font-vpPixel"
                        >
                            <img
                                src="/assets/icons/melon_os.png"
                                alt="melon os image"
                                class="icon-image pl-3"
                            />
                            <p
                                class="border-r border-r-cocoaBrown border-b border-b-tan border-t border-t-sweeterPink border-dotted rounded-r-lg pr-6 pl-3"
                            >
                                AMARA OS -- L. INODORUS v1.0
                            </p>
                            <p
                                class="border-r border-r-cocoaBrown border-b border-b-tan border-t border-t-sweeterPink border-dotted rounded-r-lg pr-6 pl-6"
                            >
                                ABOUT
                            </p>
                            <p
                                class="border-r border-r-cocoaBrown border-b border-b-tan border-t border-t-sweeterPink border-dotted rounded-r-lg pr-6 pl-6"
                            >
                                LINKS
                            </p>
                        </div>

                        <!-- right-side-top-bar -->
                        <div class="right-side-top-bar w-[14%] flex justify-center items-center">
                            <p id="current-time" class="font-vpPixel text-[15px]"></p>
                        </div>
                    </div>
                </div>

                <!-- begin desktop-container -->
                <!-- environment to emulate the desktop screen -->
                <div class="desktop-container flex flex-row mt-9 h-[calc(100vh-36px)] bg-blushMilk">
                    <!-- left-pane -->
                    <div
                        class="left-pane overflow-hidden relative w-[86%] text-center"
                    >
                        <!-- WELCOME SCREEN -->
                        <div id="welcome-screen" class="window z-10 w-[65%] h-[60%] fixed left-[25%] top-[20%]" data-page="welcome">
                            <div class="title-bar">
                                <div class="title-bar-text">WELCOME TO MY PORTFOLIO</div>
                                <div class="title-bar-controls">
                                    <button aria-label="Close" class="close-window">✕</button>
                                </div>
                            </div>
                            <div class="window-body">
                                <p>Hello there! My name is Amara and</p>
                            </div>
                            <div class="window-footer">
                                <div class="scroll-left">◀</div>
                                <div class="scroll-bar"></div>
                                <div class="scroll-right">▶</div>
                            </div>
                        </div>

                        <!-- BEGIN WINDOW DIVS -->

                        <!-- SKILLS PAGE -->
                        <div class="window hidden w-[900px] h-[500px]" data-page="skills">
                            <div class="title-bar">
                                <div class="title-bar-text"></div>
                                <div class="title-bar-controls">
                                    <button aria-label="Close" class="close-window">✕</button>
                                </div>
                            </div>
                            <div class="window-body h-[500px] overflow-y-auto"></div>
                            <div class="window-footer">
                                <div class="scroll-left">◀</div>
                                <div class="scroll-bar"></div>
                                <div class="scroll-right">▶</div>
                            </div>
                        </div>

                        <!-- ABOUT ME PAGE -->
                        <div
                            class="window hidden w-[800px] h-[450px] fixed left-[50px] top-[100px]"
                            data-page="about_me"
                        >
                            <div class="title-bar font-blockBlueprint text-2xl">
                                <div class="title-bar-text"></div>
                                <div class="title-bar-controls">
                                    <button class="close-window">x</button>
                                </div>
                            </div>
                            <div class="window-body h-[88%]"></div>
                            <div class="window-footer">
                                <div class="scroll-left">◀</div>
                                <div class="scroll-bar"></div>
                                <div class="scroll-right">▶</div>
                            </div>
                        </div>

                        <!-- PROJECTS PAGE -->
                        <div
                            class="window hidden w-[900px] h-[500px] fixed left-[200px] top-[100px]"
                            data-page="projects"
                        >
                            <div class="title-bar font-blockBlueprint text-2xl">
                                <div class="title-bar-text pl-3"></div>
                                <div class="title-bar-controls">
                                    <button class="close-window">x</button>
                                </div>
                            </div>
                            <div class="window-body h-[89%]"></div>
                            <div class="window-footer">
                                <div class="scroll-left">◀</div>
                                <div class="scroll-bar"></div>
                                <div class="scroll-right">▶</div>
                            </div>
                        </div>

                        <!-- CONTACT ME PAGE -->
                        <div class="window hidden" data-page="contact_me">
                            <div class="title-bar">
                                <div class="title-bar-text pl-3"></div>
                                <div class="title-bar-controls">
                                    <button aria-label="Close" class="close-window">✕</button>
                                </div>
                            </div>
                            <div class="window-body"></div>
                            <div class="window-footer">
                                <div class="scroll-left">◀</div>
                                <div class="scroll-bar"></div>
                                <div class="scroll-right">▶</div>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT PANE -->
                    <div class="right-pane w-[14%] flex flex-col justify-start items-center">

                        <!-- BEGIN TAB ICONS -->
                        <div class="grid grid-cols-1 grid-rows-5 gap-0 w-full h-full">

                            <!-- ABOUT ME ICON -->
                            <div class="flex flex-col justify-center items-center m-3 mx-9 hover:border-2 border-dashed border-milkTeaBrown">
                                <img
                                    src="/assets/icons/blue_person.png"
                                    alt="about_me"
                                    class="icon-image w-[60%] peer cursor-pointer z-10 relative"
                                    onclick="loadhtml('about_me')"
                                />
                                <p class="leading-none text-md mt-0">About Me</p>
                            </div>

                            <!-- SKILLS ICON -->
                            <div class="flex flex-col justify-center items-center m-3 mx-9 hover:border-2 border-dashed border-milkTeaBrown">
                                <img
                                    src="/assets/icons/ipod.png"
                                    alt="flop_drive"
                                    class="icon-image w-[60%] peer cursor-pointer z-10 relative"
                                    onclick="loadhtml('skills')"
                                />
                                <p class="leading-none text-md mt-0">Skills</p>
                            </div>

                            <!-- PROJECTS ICON -->
                            <div class="flex flex-col justify-center items-center m-3 mx-9 hover:border-2 border-dashed border-milkTeaBrown">
                                <img
                                    src="/assets/icons/proj_computer.png"
                                    alt="project"
                                    class="icon-image w-[60%] peer cursor-pointer z-10 relative"
                                    onclick="loadhtml('projects')"
                                />
                                <p class="leading-none text-md mt-0">Projects</p>
                            </div>

                            <!-- CONTACT ME ICON -->
                            <div class="flex flex-col justify-center items-center m-3 mx-9 hover:border-2 border-dashed border-milkTeaBrown">
                                <img
                                    src="/assets/icons/closed_phone.png"
                                    alt="contact_me"
                                    class="icon-image w-[60%] peer cursor-pointer z-10 relative"
                                    onclick="loadhtml('contact_me')"
                                />
                                <p class="leading-none text-md mt-0">Contact Me</p>
                            </div>

                            <!-- EVENTUAL TRASH BIN -->
                            <div></div>
                        </div>
                    </div>

                <!-- FOOTER TO EMULATE START NAV -->
                <div
                    class="footer fixed bottom-0 bg-vanillaCream z-10 w-full h-12 rounded-t-md border-t-[rgba(0, 0, 0, 0.3)]"
                >
                    <div class="flex flex-row p-2">
                        <div
                            class="flex flex-row gap-2 bg-vanilla cursor-pointer border py-1 px-4 mr-10 border-r-cocoaBrown border-b-cocoaBrown border-t-sweeterPink border-l-sweeterPink border-solid rounded-lg"
                        >
                            <i class="fa-solid fa-home pt-[2px]"></i>
                            <p>HOME</p>
                        </div>
                        
                        <div class="flex flex-row gap-2">

                            
                            <div class="footer-elem bg-vanilla cursor-pointer border py-1 px-4 border-r-cocoaBrown border-b-cocoaBrown border-t-sweeterPink border-l-sweeterPink border-solid rounded-lg">WELCOME</div>
                            <div class="footer-elem hidden bg-vanilla cursor-pointer border py-1 px-4 border-r-cocoaBrown border-b-cocoaBrown border-t-sweeterPink border-l-sweeterPink border-solid rounded-lg">ABOUT ME</div>
                            <div class="footer-elem hidden bg-vanilla cursor-pointer border py-1 px-4 border-r-cocoaBrown border-b-cocoaBrown border-t-sweeterPink border-l-sweeterPink border-solid rounded-lg">SKILLS</div>
                            <div class="footer-elem hidden bg-vanilla cursor-pointer border py-1 px-4 border-r-cocoaBrown border-b-cocoaBrown border-t-sweeterPink border-l-sweeterPink border-solid rounded-lg">PROJECTS</div>
                            <div class="footer-elem hidden bg-vanilla cursor-pointer border py-1 px-4 border-r-cocoaBrown border-b-cocoaBrown border-t-sweeterPink border-l-sweeterPink border-solid rounded-lg">CONTACT ME</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MY SCRIPTS -->
        <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
        <script src="/src/js/window_func.js"></script>
        <script src="/src/js/desktop_ui.js"></script>
    </body>
</html>
