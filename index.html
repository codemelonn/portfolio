<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Amara's Portfolio</title>
        <link rel="stylesheet" href="dist/output.css" />
    </head>

    <body class="font-byteBounce bg-softPink h-[900px]">
        <!-- begin screen  -->
        <div
            class="main-frame bg-cherryBlossomPink fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[1024px] h-[768px] z-0"
        >
            <div class="main-frame-wrapper flex flex-col">
                <!-- begin top-bar -->
                <!-- emulates the top part of a desktop -->
                <div
                    class="top-bar fixed bg-peach z-1 w-[1024px] h-12 rounded-t-lg"
                ></div>

                <!-- begin desktop-container -->
                <!-- environment to emulate the desktop screen -->
                <div class="desktop-container flex flex-row mt-12 h-[calc(768px-48px)] bg-antiqueWhite">
                    <div class="left-pane w-[86%] border"></div>
                    <div class="right-pane w-[14%] border">

                        <!-- begin icon tabs -->
                        <!-- clickable folders that open windows --> 

                        <img src="/assets/images/folder_open.png" alt="folder_open" class="h-[110px]">    
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
