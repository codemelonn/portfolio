<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- tailwind compiled css -->
        <link rel="stylesheet" href="../dist/output.css" />
        <link rel="stylesheet" href="/src/css/window.css" />

        <!-- Font Awesome 6 Free -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />

        <title>Amara's Portfolio</title>
    </head>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadhtml("");
        });
    </script>

    <body class="font-MicrosoftOG text-cocoaText min-w-full min-h-screen">
        <!-- begin screen  -->
        <!-- main-frame -->
        <div class="main-frame fixed rounded-lg z-0 w-screen h-screen">
            <!-- main-frame-wrapper -->
            <div class="main-frame-wrapper flex flex-col h-full">
                <!-- begin top-bar-container -->

                <!-- emulates the top part of a desktop -->
                <div
                    class="top-bar-container text-nowrap fixed bg-vanillaCream z-10 w-full h-9 rounded-t-md"
                >
                    <!-- top bar elements here  -->
                    <div class="top-bar h-10 flex flex-row text-xl shadow-inner">
                        <!-- left-side-top-bar -->
                        <div
                            class="left-side-top-bar w-[86%] flex items-center text-[12px] tracking-[.23em] font-vpPixel"
                        >
                            <img
                                src="/assets/icons/melon_os.png"
                                alt="melon os image"
                                class="pl-3"
                            />
                            <p
                                class="border-r border-r-cocoaBrown border-b border-b-tan border-t border-t-sweeterPink border-dotted rounded-r-lg pr-6 pl-3"
                            >
                                AMARA OS -- L. INODORUS v1.0
                            </p>
                            <p
                                class="border-r border-r-cocoaBrown border-b border-b-tan border-t border-t-sweeterPink border-dotted rounded-r-lg pr-6 pl-6"
                            >
                                ABOUT
                            </p>
                            <p
                                class="border-r border-r-cocoaBrown border-b border-b-tan border-t border-t-sweeterPink border-dotted rounded-r-lg pr-6 pl-6"
                            >
                                LINKS
                            </p>
                        </div>

                        <!-- right-side-top-bar -->
                        <div class="right-side-top-bar w-[14%] flex justify-center items-center">
                            <p id="current-time" class="font-vpPixel text-[15px]"></p>
                        </div>
                    </div>
                </div>

                <!-- begin desktop-container -->
                <!-- environment to emulate the desktop screen -->
                <div class="desktop-container flex flex-row mt-9 h-[calc(100vh-36px)] bg-blushMilk">
                    <!-- left-pane -->
                    <div
                        class="left-pane w-[86%] flex flex-row justify-center text-center pt-[15%]"
                    >
                        <!-- Welcome Screen -->
                        <div id="welcome-screen" class="window z-10 w-[500px] h-[200px]">
                            <div class="title-bar">
                                <div class="title-bar-text">WELCOME TO MY PORTFOLIO</div>
                                <div class="title-bar-controls">
                                    <button aria-label="Close" class="close-window">✕</button>
                                </div>
                            </div>
                            <div class="window-body">
                                <p>Hello there! My name is Amara and</p>
                            </div>
                            <div class="window-footer">
                                <div class="scroll-left">◀</div>
                                <div class="scroll-bar"></div>
                                <div class="scroll-right">▶</div>
                            </div>
                        </div>

                        <!-- BEGIN WINDOW DIVS -->

                        <!-- SKILLS PAGE -->
                        <div class="window hidden w-[900px] h-[500px]" data-page="skills">
                            <div class="title-bar">
                                <div class="title-bar-text"></div>
                                <div class="title-bar-controls">
                                    <button aria-label="Close" class="close-window">✕</button>
                                </div>
                            </div>
                            <div class="window-body h-[500px] overflow-y-auto"></div>
                            <div class="window-footer">
                                <div class="scroll-left">◀</div>
                                <div class="scroll-bar"></div>
                                <div class="scroll-right">▶</div>
                            </div>
                        </div>

                        <!-- ABOUT ME PAGE -->
                        <div
                            class="window hidden w-[800px] h-[450px] fixed left-[50px] top-[100px]"
                            data-page="about_me"
                        >
                            <div class="title-bar font-blockBlueprint text-2xl">
                                <div class="title-bar-text "></div>
                                <div class="title-bar-controls">
                                    <button class="close-window">x</button>
                                </div>
                            </div>
                            <div class="window-body h-[88%]"></div>
                            <div class="window-footer">
                                <div class="scroll-left">◀</div>
                                <div class="scroll-bar"></div>
                                <div class="scroll-right">▶</div>
                            </div>
                        </div>

                        <!-- PROJECTS PAGE -->
                        <div
                            class="window hidden w-[900px] h-[500px] fixed left-[200px] top-[100px]"
                            data-page="projects"
                        >
                            <div class="title-bar font-blockBlueprint text-2xl">
                                <div class="title-bar-text pl-3"></div>
                                <div class="title-bar-controls">
                                    <button class="close-window">x</button>
                                </div>
                            </div>
                            <div class="window-body h-[89%]"></div>
                            <div class="window-footer">
                                <div class="scroll-left">◀</div>
                                <div class="scroll-bar"></div>
                                <div class="scroll-right">▶</div>
                            </div>
                        </div>

                        <!-- CONTACT ME PAGE -->
                        <div class="window hidden" data-page="contact_me">
                            <div class="title-bar">
                                <div class="title-bar-text pl-3"></div>
                                <div class="title-bar-controls">
                                    <button aria-label="Close" class="close-window">✕</button>
                                </div>
                            </div>
                            <div class="window-body"></div>
                            <div class="window-footer">
                                <div class="scroll-left">◀</div>
                                <div class="scroll-bar"></div>
                                <div class="scroll-right">▶</div>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT PANE -->

                    <div class="right-pane w-[14%] flex flex-col justify-start items-center pt-10">
                        <!-- begin icon tabs -->
                        <!-- clickable folders that open windows -->

                        <!-- SKILLS ICON -->
                        <div
                            class="group relative mb-[50px] px-2 py-1 w-full flex flex-col items-center justify-center"
                            data-page="skills"
                        >
                            <div
                                class="absolute inset-0 rounded-sm border border-dotted border-[#a58d7f]/60 bg-[#a58d7f]/10 opacity-0 group-hover:opacity-100 pointer-events-none z-0"
                            ></div>

                            <img
                                src="/assets/icons/computer.png"
                                alt="flop_drive"
                                class="w-[60%] max-w-[42px] min-w-[30px] peer cursor-pointer image-pixel object-contain z-10 relative"
                                onclick="loadhtml('skills')"
                            />
                            <p
                                class="mt-[3px] text-[0.85rem] sm:text-[0.9rem] z-10 relative peer-hover:text-milkTeaBrown peer-hover:underline peer-hover:drop-shadow-md"
                                style="line-height: 1"
                            >
                                Skills
                            </p>
                        </div>

                        <!-- ABOUT ME ICON -->
                        <div
                            class="group relative mb-[50px] px-2 py-1 w-full flex flex-col items-center justify-center"
                            data-page="about_me"
                        >
                            <div
                                class="absolute inset-0 rounded-sm border border-dotted border-[#a58d7f]/60 bg-[#a58d7f]/10 opacity-0 group-hover:opacity-100 pointer-events-none z-0"
                            ></div>
                            <img
                                src="/assets/icons/text_file.png"
                                alt="about_me"
                                class="w-[60%] max-w-[42px] min-w-[30px] peer cursor-pointer image-pixel object-contain z-10 relative"
                                onclick="loadhtml('about_me')"
                            />
                            <p
                                class="mt-[3px] text-[0.85rem] sm:text-[0.9rem] z-10 relative peer-hover:text-milkTeaBrown peer-hover:underline peer-hover:drop-shadow-md"
                                style="line-height: 1"
                            >
                                About Me
                            </p>
                        </div>

                        <!-- PROJECTS ICON -->
                        <div
                            class="group relative mb-[50px] px-2 py-1 w-full flex flex-col items-center justify-center"
                            data-page="projects"
                            data-title="PROJECTS"
                        >
                            <div
                                class="absolute inset-0 rounded-sm border border-dotted border-[#a58d7f]/60 bg-[#a58d7f]/10 opacity-0 group-hover:opacity-100 pointer-events-none z-0"
                            ></div>
                            <img
                                src="/assets/icons/projects.png"
                                alt="project"
                                class="w-[60%] max-w-[42px] min-w-[30px] peer cursor-pointer image-pixel object-contain z-10 relative"
                                onclick="loadhtml('projects')"
                            />
                            <p
                                class="mt-[3px] text-[0.85rem] sm:text-[0.9rem] z-10 relative peer-hover:text-milkTeaBrown peer-hover:underline peer-hover:drop-shadow-md"
                                style="line-height: 1"
                            >
                                Projects
                            </p>
                        </div>

                        <!-- CONTACT ME ICON -->
                        <div
                            class="group relative mb-[50px] px-2 py-1 w-full flex flex-col items-center justify-center"
                            data-page="contact_me"
                            data-title="CONTACT ME"
                        >
                            <div
                                class="absolute inset-0 rounded-sm border border-dotted border-[#a58d7f]/60 bg-[#a58d7f]/10 opacity-0 group-hover:opacity-100 pointer-events-none z-0"
                            ></div>
                            <img
                                src="/assets/icons/contact_me.png"
                                alt="contact_me"
                                class="w-[60%] max-w-[42px] min-w-[30px] peer cursor-pointer image-pixel object-contain z-10 relative"
                                onclick="loadhtml('contact_me')"
                            />
                            <p
                                class="mt-[3px] text-[0.85rem] sm:text-[0.9rem] z-10 relative peer-hover:text-milkTeaBrown peer-hover:underline peer-hover:drop-shadow-md"
                                style="line-height: 1"
                            >
                                Contact Me
                            </p>
                        </div>
                    </div>
                </div>

                <!-- FOOTER TO EMULATE START NAV -->
                <div
                    class="fixed bottom-0 bg-vanillaCream z-10 w-full h-12 rounded-t-md border-t-[rgba(0, 0, 0, 0.3)]"
                >
                    <div class="flex flex-row p-2">
                        <div
                            class="flex flex-row gap-2 bg-vanilla cursor-pointer border py-1 px-4 border-r-cocoaBrown border-b-cocoaBrown border-t-sweeterPink border-l-sweeterPink border-solid rounded-lg"
                        >
                            <i class="fa-solid fa-home pt-[2px]"></i>
                            <p>HOME</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MY SCRIPTS -->
        <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
        <script src="/src/js/window_func.js"></script>
        <script src="/src/js/desktop_ui.js"></script>
    </body>
</html>
