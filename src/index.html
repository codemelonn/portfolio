<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- tailwind compiled css -->
        <link rel="stylesheet" href="../dist/output.css" />
        <link rel="stylesheet" href="/src/css/window.css" />

        <title>Amara's Portfolio</title>
    </head>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadhtml("projects");
        });
    </script>

    <body class="font-MicrosoftOG text-cocoaText min-w-full min-h-screen">
        <!-- begin screen  -->
        <!-- main-frame -->
        <div class="main-frame fixed rounded-lg z-0 w-screen h-screen">
            <!-- main-frame-wrapper -->
            <div class="main-frame-wrapper flex flex-col h-full">
                <!-- begin top-bar-container -->
                <!-- emulates the top part of a desktop -->
                <div
                    class="top-bar-container fixed bg-vanillaCream drop-shadow-lg z-1 w-full h-9 rounded-t-lg"
                >
                    <!-- top bar elements here  -->
                    <div class="top-bar h-9 flex flex-row text-xl">
                        <!-- left-side-top-bar -->
                        <div
                            class="left-side-top-bar w-[86%] flex space-x-14 items-center text-2xl font-blockBlueprint"
                        >
                            <p class="pl-3">AMARA OS</p>
                            <p>ABOUT</p>
                            <p>LINKS</p>
                        </div>

                        <!-- right-side-top-bar -->
                        <div class="right-side-top-bar w-[14%] flex justify-center items-center">
                            <p id="current-time" class="font-byteBounce"></p>
                        </div>
                    </div>
                </div>

                <!-- begin desktop-container -->
                <!-- environment to emulate the desktop screen -->
                <div class="desktop-container flex flex-row mt-9 h-[calc(100vh-36px)] bg-blushMilk">
                    <!-- left-pane -->
                    <div
                        class="left-pane w-[86%] flex flex-row justify-center text-center pt-[15%]"
                    >
                        <!-- Pane filler -->
                        <div
                            class="pane-filler bg-milkTeaBrown absolute bottom-0 left-0 w-[85%] h-[90%] rounded-tr-[15px] rounded-br-[15px] z-0"
                        ></div>

                        <!-- Welcome Screen -->
                        <div id="welcome-screen" class="window hidden z-10 w-[500px] h-[200px]">
                            <div class="title-bar">
                                <div class="title-bar-text pl-3">WELCOME TO MY PORTFOLIO</div>
                                <div class="title-bar-controls">
                                    <button aria-label="Minimize">_</button>
                                    <button aria-label="Maximize">□</button>
                                    <button aria-label="Close" class="close-window">✕</button>
                                </div>
                            </div>
                            <div class="window-body">
                                <p>Hello there! My name is Amara and</p>
                            </div>
                        </div>

                        <!-- BEGIN WINDOW DIVS -->

                        <!-- SKILLS PAGE -->
                        <div class="window hidden w-[900px] h-[500px]" data-page="skills">
                            <div class="title-bar">
                                <div class="title-bar-text pl-3"></div>
                                <div class="title-bar-controls">
                                    <button aria-label="Minimize">_</button>
                                    <button aria-label="Maximize">□</button>
                                    <button aria-label="Close" class="close-window">✕</button>
                                </div>
                            </div>
                            <div class="window-body h-[500px] overflow-y-auto"></div>
                        </div>

                        <!-- ABOUT ME PAGE -->
                        <div class="window hidden" data-page="about_me">
                            <div class="title-bar">
                                <div class="title-bar-text pl-3"></div>
                                <div class="title-bar-controls">
                                    <button aria-label="Minimize">_</button>
                                    <button aria-label="Maximize">□</button>
                                    <button aria-label="Close" class="close-window">✕</button>
                                </div>
                            </div>
                            <div class="window-body"></div>
                        </div>

                        <!-- PROJECTS PAGE -->
                        <div
                            class="window hidden w-[900px] h-[500px] fixed left-[200px] top-[100px]"
                            data-page="projects"
                        >
                            <div class="title-bar font-blockBlueprint text-2xl">
                                <div class="title-bar-text pl-3"></div>
                                <div class="title-bar-controls">
                                    <button aria-label="Close" class="close-window">✕</button>
                                </div>
                            </div>
                            <div class="window-body h-[93.76%]"></div>
                        </div>

                        <!-- CONTACT ME PAGE -->
                        <div class="window hidden" data-page="contact_me">
                            <div class="title-bar">
                                <div class="title-bar-text pl-3"></div>
                                <div class="title-bar-controls">
                                    <button aria-label="Minimize">_</button>
                                    <button aria-label="Maximize">□</button>
                                    <button aria-label="Close" class="close-window">✕</button>
                                </div>
                            </div>
                            <div class="window-body"></div>
                        </div>
                    </div>

                    <!-- RIGHT PANE -->

                    <div class="right-pane w-[14%] flex flex-col justify-start items-center pt-10">
                        <!-- begin icon tabs -->
                        <!-- clickable folders that open windows -->

                        <!-- SKILLS ICON -->
                        <div
                            class="group relative mb-[50px] px-2 py-1 w-full flex flex-col items-center justify-center"
                            data-page="skills"
                            style="
                                width: 6.5vw;
                                height: 6.5vw;
                                min-width: 60px;
                                min-height: 60px;
                                max-width: 90px;
                                max-height: 90px;
                            "
                        >
                            <div
                                class="absolute inset-0 rounded-sm border border-dotted border-[#a58d7f]/60 bg-[#a58d7f]/10 opacity-0 group-hover:opacity-100 pointer-events-none z-0"
                            ></div>

                            <img
                                src="/assets/icons/computer.png"
                                alt="flop_drive"
                                class="w-[60%] max-w-[42px] min-w-[30px] peer cursor-pointer image-pixel object-contain z-10 relative"
                                onclick="loadhtml('skills')"
                            />
                            <p
                                class="mt-[3px] text-[0.85rem] sm:text-[0.9rem] z-10 relative peer-hover:text-milkTeaBrown peer-hover:underline peer-hover:drop-shadow-md"
                                style="line-height: 1"
                            >
                                Skills
                            </p>
                        </div>

                        <!-- ABOUT ME ICON -->
                        <div
                            class="group relative mb-[50px] px-2 py-1 w-full flex flex-col items-center justify-center"
                            data-page="about_me"
                            style="
                                width: 6.5vw;
                                height: 6.5vw;
                                min-width: 60px;
                                min-height: 60px;
                                max-width: 90px;
                                max-height: 90px;
                            "
                        >
                            <div
                                class="absolute inset-0 rounded-sm border border-dotted border-[#a58d7f]/60 bg-[#a58d7f]/10 opacity-0 group-hover:opacity-100 pointer-events-none z-0"
                            ></div>
                            <img
                                src="/assets/icons/text_file.png"
                                alt="about_me"
                                class="w-[60%] max-w-[42px] min-w-[30px] peer cursor-pointer image-pixel object-contain z-10 relative"
                                onclick="loadhtml('about_me')"
                            />
                            <p
                                class="mt-[3px] text-[0.85rem] sm:text-[0.9rem] z-10 relative peer-hover:text-milkTeaBrown peer-hover:underline peer-hover:drop-shadow-md"
                                style="line-height: 1"
                            >
                                About Me
                            </p>
                        </div>

                        <!-- PROJECTS ICON -->
                        <div
                            class="group relative mb-[50px] px-2 py-1 w-full flex flex-col items-center justify-center"
                            data-page="projects"
                            data-title="PROJECTS"
                            style="
                                width: 6.5vw;
                                height: 6.5vw;
                                min-width: 60px;
                                min-height: 60px;
                                max-width: 90px;
                                max-height: 90px;
                            "
                        >
                            <div
                                class="absolute inset-0 rounded-sm border border-dotted border-[#a58d7f]/60 bg-[#a58d7f]/10 opacity-0 group-hover:opacity-100 pointer-events-none z-0"
                            ></div>
                            <img
                                src="/assets/icons/projects.png"
                                alt="project"
                                class="w-[60%] max-w-[42px] min-w-[30px] peer cursor-pointer image-pixel object-contain z-10 relative"
                                onclick="loadhtml('projects')"
                            />
                            <p
                                class="mt-[3px] text-[0.85rem] sm:text-[0.9rem] z-10 relative peer-hover:text-milkTeaBrown peer-hover:underline peer-hover:drop-shadow-md"
                                style="line-height: 1"
                            >
                                Projects
                            </p>
                        </div>

                        <!-- CONTACT ME ICON -->
                        <div
                            class="group relative mb-[50px] px-2 py-1 w-full flex flex-col items-center justify-center"
                            data-page="contact_me"
                            data-title="CONTACT ME"
                            style="
                                width: 6.5vw;
                                height: 6.5vw;
                                min-width: 60px;
                                min-height: 60px;
                                max-width: 90px;
                                max-height: 90px;
                            "
                        >
                            <div
                                class="absolute inset-0 rounded-sm border border-dotted border-[#a58d7f]/60 bg-[#a58d7f]/10 opacity-0 group-hover:opacity-100 pointer-events-none z-0"
                            ></div>
                            <img
                                src="/assets/icons/contact_me.png"
                                alt="contact_me"
                                class="w-[60%] max-w-[42px] min-w-[30px] peer cursor-pointer image-pixel object-contain z-10 relative"
                                onclick="loadhtml('contact_me')"
                            />
                            <p
                                class="mt-[3px] text-[0.85rem] sm:text-[0.9rem] z-10 relative peer-hover:text-milkTeaBrown peer-hover:underline peer-hover:drop-shadow-md"
                                style="line-height: 1"
                            >
                                Contact Me
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MY SCRIPTS -->
        <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
        <script src="/src/js/window_func.js"></script>
        <script src="/src/js/desktop_ui.js"></script>
    </body>
</html>
